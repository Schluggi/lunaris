name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    # Avoid loop: automated version-bump commit must not trigger another release.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.head_commit != null &&
       !startsWith(github.event.head_commit.message, 'chore(release):'))

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record previous release tag
        id: prev
        run: |
          set -euo pipefail
          if tag=$(git describe --tags --abbrev=0 2>/dev/null); then
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine release type from commits
        id: gate
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "bump=patch" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch — releasing with default patch bump."
            exit 0
          fi
          PREV="${{ steps.prev.outputs.tag }}"
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..HEAD"
          else
            RANGE="HEAD"
          fi
          # Full commit message per commit (subject + body). Breaking footer must start its line,
          # matching Conventional Commits — avoids prose like "see BREAKING CHANGE: …" mid-sentence.
          LOG="$(git log "$RANGE" --no-merges --format='%s%n%b')"

          if printf '%s' "$LOG" | grep -Eq '^[[:space:]]*BREAKING CHANGE:' ||
             git log "$RANGE" --no-merges --extended-regexp --grep='^[a-z]+(\([^)]*\))?!:' -1 -q; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "bump=major" >> "$GITHUB_OUTPUT"
            echo "Breaking change found in ${RANGE} — major release."
          elif git log "$RANGE" --no-merges --extended-regexp --grep='^feat(\([^)]*\))?:' -1 -q; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "bump=minor" >> "$GITHUB_OUTPUT"
            echo "feat commit(s) found in ${RANGE} — minor release."
          elif git log "$RANGE" --no-merges --extended-regexp --grep='^fix(\([^)]*\))?:' -1 -q; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "bump=patch" >> "$GITHUB_OUTPUT"
            echo "fix commit(s) found in ${RANGE} — patch release."
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No fix/feat/breaking commits in ${RANGE} — skipping release."
          fi

      - name: Skip release (no semver-relevant commits)
        if: steps.gate.outputs.release != 'true'
        run: echo "::notice::Release skipped — no fix, feat, or breaking change commits since the previous tag."

      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.release == 'true'
        with:
          toolchain: 1.84.0
          targets: aarch64-unknown-linux-musl

      # Static musl binary — avoids GLIBC version mismatch on the Pod (gnu target links a newer glibc than older Pod OS).
      - name: Install Zig (cargo-zigbuild)
        if: steps.gate.outputs.release == 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install cargo-zigbuild
        if: steps.gate.outputs.release == 'true'
        run: cargo install cargo-zigbuild --version 0.20.1 --locked

      - name: Bump semantic version in Cargo.toml
        if: steps.gate.outputs.release == 'true'
        id: bump
        run: |
          set -euo pipefail
          BUMP_KIND="${{ steps.gate.outputs.bump }}"
          export BUMP_KIND
          python3 << 'PY'
          import os
          import re
          from pathlib import Path

          bump_kind = os.environ["BUMP_KIND"]
          path = Path("Cargo.toml")
          text = path.read_text()
          m = re.search(r'^version\s*=\s*"(\d+)\.(\d+)\.(\d+)"', text, re.MULTILINE)
          if not m:
              raise SystemExit("Could not parse version from Cargo.toml")
          major, minor, patch = (int(m.group(1)), int(m.group(2)), int(m.group(3)))

          if bump_kind == "major":
              new_ver = f"{major + 1}.0.0"
          elif bump_kind == "minor":
              new_ver = f"{major}.{minor + 1}.0"
          elif bump_kind == "patch":
              new_ver = f"{major}.{minor}.{patch + 1}"
          else:
              raise SystemExit(f"Unsupported bump kind: {bump_kind}")

          new_text, n = re.subn(
              r'(^version\s*=\s*)"(\d+)\.(\d+)\.(\d+)"',
              rf'\1"{new_ver}"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if n != 1:
              raise SystemExit("Failed to substitute version in Cargo.toml")
          path.write_text(new_text)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              print(f"version={new_ver}", file=f)
          print(f"Bumped ({bump_kind}) version to {new_ver}")
          PY

      - name: Build release (aarch64 musl, static)
        if: steps.gate.outputs.release == 'true'
        run: cargo zigbuild --release --verbose --target aarch64-unknown-linux-musl

      - name: Stage binaries
        if: steps.gate.outputs.release == 'true'
        run: |
          mkdir -p dist
          cp target/aarch64-unknown-linux-musl/release/lunaris "dist/lunaris"
          sha256sum dist/* > dist/SHA256SUMS

      - name: Commit version bump and tag
        if: steps.gate.outputs.release == 'true'
        id: tag
        run: |
          set -euo pipefail
          VERSION="${{ steps.bump.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml
          git commit -m "chore(release): v${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin HEAD:"${{ github.ref_name }}"
          git push origin "refs/tags/v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes (by commit type)
        if: steps.gate.outputs.release == 'true'
        run: |
          set -euo pipefail
          PREV="${{ steps.prev.outputs.tag }}"
          NEW="v${{ steps.tag.outputs.version }}"
          REPO="${{ github.repository }}"
          export PREV NEW REPO
          python3 << 'PY'
          import os
          import re
          import subprocess
          from collections import defaultdict
          from pathlib import Path

          prev = os.environ.get("PREV", "")
          new = os.environ["NEW"]
          repo = os.environ["REPO"]
          range_spec = f"{prev}..{new}" if prev else new

          fmt = "%h%x1f%s%x1f%b%x1fENDRECORD%x00"
          out = subprocess.check_output(
              [
                  "git",
                  "log",
                  range_spec,
                  "--no-merges",
                  "--invert-grep",
                  "--grep=^chore(release):",
                  f"--pretty=format:{fmt}",
              ],
              text=True,
          )

          cc = re.compile(r"^([a-z]+)(?:\([^)]*\))?(!)?:\s*(.*)$", re.I)
          breaking_body = re.compile(r"(?m)^[ \t]*BREAKING CHANGE:")

          # Order of sections in the rendered notes (breaking first).
          section_meta = (
              ("breaking", "💥 Breaking changes"),
              ("feat", "✨ Features"),
              ("fix", "🐛 Fixes"),
              ("perf", "⚡ Performance"),
              ("refactor", "♻️ Refactoring"),
              ("docs", "📝 Documentation"),
              ("test", "✅ Tests"),
              ("ci", "👷 CI"),
              ("build", "🏗️ Build"),
              ("chore", "🔧 Maintenance"),
              ("style", "💄 Style"),
              ("revert", "⏪ Reverts"),
              ("other", "📦 Other"),
          )
          sections: defaultdict[str, list[str]] = defaultdict(list)

          for raw in out.split("\x00"):
              raw = raw.strip()
              if not raw.endswith("ENDRECORD"):
                  continue
              core = raw[: -len("ENDRECORD")]
              if core.endswith("\x1f"):
                  core = core[:-1]
              core = core.strip()
              if core.count("\x1f") < 2:
                  continue
              h, subject, body = core.split("\x1f", 2)
              line = f"- {subject.strip()} ({h.strip()})"
              body = body or ""

              m = cc.match(subject.strip())
              ctype = (m.group(1).lower() if m else None)
              has_bang = bool(m and m.group(2))

              if has_bang or breaking_body.search(body):
                  key = "breaking"
              elif ctype == "feat":
                  key = "feat"
              elif ctype == "fix":
                  key = "fix"
              elif ctype == "perf":
                  key = "perf"
              elif ctype == "refactor":
                  key = "refactor"
              elif ctype == "docs":
                  key = "docs"
              elif ctype == "test":
                  key = "test"
              elif ctype == "ci":
                  key = "ci"
              elif ctype == "build":
                  key = "build"
              elif ctype == "chore":
                  key = "chore"
              elif ctype == "style":
                  key = "style"
              elif ctype == "revert":
                  key = "revert"
              else:
                  key = "other"

              sections[key].append(line)

          lines_out: list[str] = []
          for key, heading in section_meta:
              entries = sections.get(key, [])
              if not entries:
                  continue
              lines_out.append(f"## {heading}")
              lines_out.append("")
              lines_out.extend(entries)
              lines_out.append("")

          if not lines_out:
              lines_out = ["_(No commits in this release.)_", ""]

          if prev:
              lines_out.append(f"**Full Changelog**: https://github.com/{repo}/compare/{prev}...{new}")
          else:
              lines_out.append(f"**Full Changelog**: https://github.com/{repo}/commits/{new}")

          Path("release_body.md").write_text("\n".join(lines_out).rstrip() + "\n", encoding="utf-8")
          PY

      - name: Publish GitHub Release
        if: steps.gate.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.tag.outputs.version }}
          name: v${{ steps.tag.outputs.version }}
          generate_release_notes: false
          body_path: release_body.md
          files: |
            dist/lunaris
            dist/SHA256SUMS
