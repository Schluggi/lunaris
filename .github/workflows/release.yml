name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    # Avoid loop: automated version-bump commit must not trigger another release.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.head_commit != null &&
       !startsWith(github.event.head_commit.message, 'chore(release):'))

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record previous release tag
        id: prev
        run: |
          set -euo pipefail
          if tag=$(git describe --tags --abbrev=0 2>/dev/null); then
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Gate release on feat/fix commits
        id: gate
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch — releasing."
            exit 0
          fi
          PREV="${{ steps.prev.outputs.tag }}"
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..HEAD"
          else
            RANGE="HEAD"
          fi
          if git log "$RANGE" --no-merges --extended-regexp \
              --grep='^(feat|fix)(\([^)]*\))?(!)?:' -1 -q; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "feat/fix commit(s) in ${RANGE} — releasing."
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No feat/fix commits in ${RANGE} — skipping release."
          fi

      - name: Skip release (no feat/fix commits)
        if: steps.gate.outputs.release != 'true'
        run: echo "::notice::Release skipped — no feat or fix commits since the previous tag."

      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.release == 'true'
        with:
          toolchain: 1.84.0
          targets: aarch64-unknown-linux-gnu

      - name: Install AArch64 GNU toolchain (linker)
        if: steps.gate.outputs.release == 'true'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Bump patch version in Cargo.toml
        if: steps.gate.outputs.release == 'true'
        id: bump
        run: |
          set -euo pipefail
          python3 << 'PY'
          import os
          import re
          from pathlib import Path

          path = Path("Cargo.toml")
          text = path.read_text()
          m = re.search(r'^version\s*=\s*"(\d+)\.(\d+)\.(\d+)"', text, re.MULTILINE)
          if not m:
              raise SystemExit("Could not parse version from Cargo.toml")
          major, minor, patch = (int(m.group(1)), int(m.group(2)), int(m.group(3)))
          new_ver = f"{major}.{minor}.{patch + 1}"
          new_text, n = re.subn(
              r'(^version\s*=\s*)"(\d+)\.(\d+)\.(\d+)"',
              rf'\1"{new_ver}"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if n != 1:
              raise SystemExit("Failed to substitute version in Cargo.toml")
          path.write_text(new_text)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              print(f"version={new_ver}", file=f)
          print(f"Bumped version to {new_ver}")
          PY

      - name: Build release (aarch64)
        if: steps.gate.outputs.release == 'true'
        run: cargo build --release --verbose --target aarch64-unknown-linux-gnu

      - name: Stage binaries
        if: steps.gate.outputs.release == 'true'
        run: |
          mkdir -p dist
          cp target/aarch64-unknown-linux-gnu/release/lunaris "dist/lunaris"
          sha256sum dist/* > dist/SHA256SUMS

      - name: Commit version bump and tag
        if: steps.gate.outputs.release == 'true'
        id: tag
        run: |
          set -euo pipefail
          VERSION="${{ steps.bump.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml
          git commit -m "chore(release): v${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin HEAD:"${{ github.ref_name }}"
          git push origin "refs/tags/v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes (all commits)
        if: steps.gate.outputs.release == 'true'
        run: |
          set -euo pipefail
          PREV="${{ steps.prev.outputs.tag }}"
          NEW="v${{ steps.tag.outputs.version }}"
          REPO="${{ github.repository }}"
          {
            echo "## Commits"
            echo ""
            if [ -n "$PREV" ]; then
              git log "${PREV}..${NEW}" --no-merges --invert-grep --grep='^chore(release):' --pretty=format:'- %s (%h)%n'
            else
              git log "${NEW}" --no-merges --invert-grep --grep='^chore(release):' --pretty=format:'- %s (%h)%n'
            fi
            echo ""
            if [ -n "$PREV" ]; then
              echo "**Full Changelog**: https://github.com/${REPO}/compare/${PREV}...${NEW}"
            else
              echo "**Full Changelog**: https://github.com/${REPO}/commits/${NEW}"
            fi
          } > release_body.md

      - name: Publish GitHub Release
        if: steps.gate.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.tag.outputs.version }}
          name: v${{ steps.tag.outputs.version }}
          generate_release_notes: false
          body_path: release_body.md
          files: |
            dist/lunaris
            dist/SHA256SUMS
