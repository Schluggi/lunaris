name: Release

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    # Avoid loop: automated version-bump commit must not trigger another release.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.head_commit != null &&
       !startsWith(github.event.head_commit.message, 'chore(release):'))

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record previous release tag
        id: prev
        run: |
          set -euo pipefail
          if tag=$(git describe --tags --abbrev=0 2>/dev/null); then
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine release type from commits
        id: gate
        run: |
          set -euo pipefail
          MANUAL=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MANUAL=true
          fi
          PREV="${{ steps.prev.outputs.tag }}"
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..HEAD"
            REV_RANGE="${PREV}..HEAD"
          else
            RANGE="HEAD"
            REV_RANGE="HEAD"
          fi
          # Push: release only when a commit **subject line** is feat: or fix: (Conventional Commits).
          # workflow_dispatch: same bump rules from commits since the last tag; patch if none (forced release).
          # chore/docs/ci/etc. never gate a release; `git log --grep` is avoided because Git's multiline
          # ^ anchor can match body lines (e.g. "fix:" in a chore commit message) and falsely trigger.
          #
          # Major bump only for **feat** breaking (feat!: or feat: … + BREAKING CHANGE footer on that
          # same commit). fix: + BREAKING CHANGE stays patch; other types with ! or footer do not major.
          HAS_FEAT_BREAKING=false
          HAS_FEAT_MINOR=false
          HAS_FIX=false
          while IFS= read -r rev; do
            [ -z "$rev" ] && continue
            subject=$(git log -1 --format='%s' "$rev")
            body=$(git log -1 --format='%b' "$rev")
            if printf '%s\n' "$subject" | grep -Eq '^feat(\([^)]*\))?!:'; then
              HAS_FEAT_BREAKING=true
            elif printf '%s\n' "$subject" | grep -Eq '^feat(\([^)]*\))?:' &&
                 printf '%s\n' "$body" | grep -Eq '^[[:space:]]*BREAKING CHANGE:'; then
              HAS_FEAT_BREAKING=true
            elif printf '%s\n' "$subject" | grep -Eq '^feat(\([^)]*\))?:'; then
              HAS_FEAT_MINOR=true
            elif printf '%s\n' "$subject" | grep -Eq '^fix(\([^)]*\))?:'; then
              HAS_FIX=true
            fi
          done < <(git rev-list --no-merges "$REV_RANGE")

          if [ "$HAS_FEAT_BREAKING" = true ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "bump=major" >> "$GITHUB_OUTPUT"
            echo "feat breaking change in ${RANGE} — major release."
          elif [ "$HAS_FEAT_MINOR" = true ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "bump=minor" >> "$GITHUB_OUTPUT"
            echo "feat commit(s) found in ${RANGE} — minor release."
          elif [ "$HAS_FIX" = true ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "bump=patch" >> "$GITHUB_OUTPUT"
            echo "fix commit(s) found in ${RANGE} — patch release."
          elif [ "$MANUAL" = true ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "bump=patch" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch — no feat/fix in ${RANGE}; patch bump."
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No fix/feat commits in ${RANGE} — skipping release."
          fi

      - name: Skip release (no semver-relevant commits)
        if: steps.gate.outputs.release != 'true'
        run: echo "::notice::Release skipped — no fix or feat commits since the previous tag."

      # Must match rust-toolchain.toml channel — otherwise `rustup` uses 1.95.x for `cargo`
      # while the musl target was added only to an older toolchain → E0463 (no `core` for aarch64 musl).
      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.release == 'true'
        with:
          toolchain: 1.96.1
          targets: aarch64-unknown-linux-musl

      # Static musl binary — avoids GLIBC version mismatch on the Pod (gnu target links a newer glibc than older Pod OS).
      - name: Install Zig (cargo-zigbuild)
        if: steps.gate.outputs.release == 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install cargo-zigbuild
        if: steps.gate.outputs.release == 'true'
        run: cargo install cargo-zigbuild --version 0.20.1 --locked

      - name: Bump semantic version in Cargo.toml
        if: steps.gate.outputs.release == 'true'
        id: bump
        run: |
          set -euo pipefail
          BUMP_KIND="${{ steps.gate.outputs.bump }}"
          export BUMP_KIND
          python3 << 'PY'
          import os
          import re
          from pathlib import Path

          bump_kind = os.environ["BUMP_KIND"]
          path = Path("Cargo.toml")
          text = path.read_text()
          m = re.search(r'^version\s*=\s*"(\d+)\.(\d+)\.(\d+)"', text, re.MULTILINE)
          if not m:
              raise SystemExit("Could not parse version from Cargo.toml")
          major, minor, patch = (int(m.group(1)), int(m.group(2)), int(m.group(3)))

          if bump_kind == "major":
              new_ver = f"{major + 1}.0.0"
          elif bump_kind == "minor":
              new_ver = f"{major}.{minor + 1}.0"
          elif bump_kind == "patch":
              new_ver = f"{major}.{minor}.{patch + 1}"
          else:
              raise SystemExit(f"Unsupported bump kind: {bump_kind}")

          new_text, n = re.subn(
              r'(^version\s*=\s*)"(\d+)\.(\d+)\.(\d+)"',
              rf'\1"{new_ver}"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if n != 1:
              raise SystemExit("Failed to substitute version in Cargo.toml")
          path.write_text(new_text)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              print(f"version={new_ver}", file=f)
          print(f"Bumped ({bump_kind}) version to {new_ver}")
          PY

      - name: Build release (aarch64 musl, static)
        if: steps.gate.outputs.release == 'true'
        run: cargo zigbuild --release --verbose --target aarch64-unknown-linux-musl

      - name: Stage binaries
        if: steps.gate.outputs.release == 'true'
        run: |
          mkdir -p dist
          cp target/aarch64-unknown-linux-musl/release/lunaris "dist/lunaris"
          sha256sum dist/* > dist/SHA256SUMS

      - name: Commit version bump and tag
        if: steps.gate.outputs.release == 'true'
        id: tag
        run: |
          set -euo pipefail
          VERSION="${{ steps.bump.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml
          git commit -m "chore(release): v${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin HEAD:"${{ github.ref_name }}"
          git push origin "refs/tags/v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes (by commit type)
        if: steps.gate.outputs.release == 'true'
        run: |
          set -euo pipefail
          PREV="${{ steps.prev.outputs.tag }}"
          NEW="v${{ steps.tag.outputs.version }}"
          REPO="${{ github.repository }}"
          export PREV NEW REPO
          python3 << 'PY'
          import os
          import re
          import subprocess
          from collections import defaultdict
          from pathlib import Path

          prev = os.environ.get("PREV", "")
          new = os.environ["NEW"]
          repo = os.environ["REPO"]
          range_spec = f"{prev}..{new}" if prev else new

          # `-z` NUL-separates commits (do not put `%x00` in `--pretty`: `%b` can contain NUL and
          # would break naive `split("\\x00")`). Do not `.strip()` the payload after removing
          # `ENDRECORD`: Python's default strip() also removes U+001F and would drop empty bodies.
          fmt = "%h%x1f%s%x1f%b%x1fENDRECORD"
          out = subprocess.check_output(
              [
                  "git",
                  "log",
                  range_spec,
                  "-z",
                  "--no-merges",
                  "--invert-grep",
                  "--grep=^chore(release):",
                  f"--pretty=format:{fmt}",
              ],
              text=True,
          )

          cc = re.compile(r"^([a-z]+)(?:\([^)]*\))?(!)?:\s*(.*)$", re.I)
          breaking_body = re.compile(r"(?m)^[ \t]*BREAKING CHANGE:")

          # Order of sections in the rendered notes (breaking first).
          section_meta = (
              ("breaking", "💥 Breaking changes"),
              ("feat", "✨ Features"),
              ("fix", "🐛 Fixes"),
              ("perf", "⚡ Performance"),
              ("refactor", "♻️ Refactoring"),
              ("docs", "📝 Documentation"),
              ("test", "✅ Tests"),
              ("ci", "👷 CI"),
              ("build", "🏗️ Build"),
              ("chore", "🔧 Maintenance"),
              ("style", "💄 Style"),
              ("revert", "⏪ Reverts"),
              ("other", "📦 Other"),
          )
          sections: defaultdict[str, list[str]] = defaultdict(list)

          for raw in out.split("\x00"):
              raw = raw.strip()
              if not raw.endswith("ENDRECORD"):
                  continue
              # Git emits `%b%x1fENDRECORD`. Empty `%b` → `…%x1f%x1fENDRECORD`. Strip only the
              # trailing `ENDRECORD` literal; peel one 0x1f from the body field (record delimiter).
              core = raw[: -len("ENDRECORD")]
              parts = core.split("\x1f", 2)
              if len(parts) < 3:
                  continue
              h, subject, body = parts[0], parts[1], parts[2].removesuffix("\x1f")
              line = f"- {subject.strip()} ({h.strip()})"
              body = body or ""

              m = cc.match(subject.strip())
              ctype = (m.group(1).lower() if m else None)
              has_bang = bool(m and m.group(2))

              feat_breaking = ctype == "feat" and (
                  has_bang or bool(breaking_body.search(body))
              )
              if feat_breaking:
                  key = "breaking"
              elif ctype == "feat":
                  key = "feat"
              elif ctype == "fix":
                  key = "fix"
              elif ctype == "perf":
                  key = "perf"
              elif ctype == "refactor":
                  key = "refactor"
              elif ctype == "docs":
                  key = "docs"
              elif ctype == "test":
                  key = "test"
              elif ctype == "ci":
                  key = "ci"
              elif ctype == "build":
                  key = "build"
              elif ctype == "chore":
                  key = "chore"
              elif ctype == "style":
                  key = "style"
              elif ctype == "revert":
                  key = "revert"
              else:
                  key = "other"

              sections[key].append(line)

          lines_out: list[str] = []
          for key, heading in section_meta:
              entries = sections.get(key, [])
              if not entries:
                  continue
              lines_out.append(f"## {heading}")
              lines_out.append("")
              lines_out.extend(entries)
              lines_out.append("")

          if not lines_out:
              lines_out = ["_(No commits in this release.)_", ""]

          if prev:
              lines_out.append(f"**Full Changelog**: https://github.com/{repo}/compare/{prev}...{new}")
          else:
              lines_out.append(f"**Full Changelog**: https://github.com/{repo}/commits/{new}")

          Path("release_body.md").write_text("\n".join(lines_out).rstrip() + "\n", encoding="utf-8")
          PY

      - name: Publish GitHub Release
        if: steps.gate.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.tag.outputs.version }}
          name: v${{ steps.tag.outputs.version }}
          generate_release_notes: false
          body_path: release_body.md
          files: |
            dist/lunaris
            dist/SHA256SUMS
