name: CI

on:
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: clippy, rustfmt

      - name: Cargo fmt (check)
        run: cargo fmt --all -- --check

      - name: Cargo test
        run: cargo test --verbose

      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Same CPU family as Eight Sleep Pod SOM (aarch64); catches missing cross-setup early.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Must match rust-toolchain.toml channel — cargo uses that toolchain, not @stable.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          targets: aarch64-unknown-linux-musl

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --version 0.22.3 --locked

      - name: Cargo build (aarch64 musl release, static — matches Pod glibc constraints)
        run: cargo zigbuild --release --verbose --target aarch64-unknown-linux-musl
