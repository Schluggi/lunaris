name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo fmt (check)
        run: cargo fmt --all -- --check

      - name: Cargo test
        run: cargo test --verbose

      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo build (release)
        run: cargo build --release --verbose

  # Same CPU family as Eight Sleep Pod SOM (aarch64); catches missing cross-setup early.
  build-aarch64-gnu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Must match rust-toolchain.toml channel — cargo uses that toolchain, not @stable.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.84.0
          targets: aarch64-unknown-linux-gnu

      - name: Install AArch64 GNU toolchain (linker)
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cargo build (aarch64 release)
        run: cargo build --release --verbose --target aarch64-unknown-linux-gnu
