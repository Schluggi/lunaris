[package]
name = "lunaris"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/Schluggi/lunaris"
description = "Local MQTT bridge: Eight Sleep Pod Frozen (prime, climate) + Sensor vibration (per side) + IS31FL3194 LED, Home Assistant MQTT discovery."
readme = "README.md"

[[bin]]
name = "lunaris"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
rumqttc = "0.24"
clap = { version = "=4.5.27", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-serial = "5.4"
i2cdev = "0.6"

[dev-dependencies]
