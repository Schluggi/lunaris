[package]
name = "lunaris"
version = "5.4.0"
edition = "2021"
rust-version = "1.99"
license = "GPL-3.0"
repository = "https://github.com/Schluggi/lunaris"
description = "Local MQTT bridge: Eight Sleep Pod Frozen (prime, climate) + Sensor vibration (per side) + IS31FL3194 LED, Home Assistant MQTT discovery."
readme = "README.md"

[[bin]]
name = "lunaris"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
rumqttc = "0.25"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-serial = "5.4"
# Same `serialport` 4.x tokio-serial builds on — direct dep for `SerialStream::set_baud_rate`
# (Sensor bootloader→firmware baud switch without close/reopen). `default-features = false`
# matches tokio-serial: no libudev (we never enumerate USB ports, only open ttyS*/PTY paths).
serialport = { version = "4", default-features = false }
i2cdev = "0.6"
# Sync HTTP: `native-tls` + invalid certs (Pod has no CA bundle); not default rustls/webpki.
ureq = { version = "3", default-features = false, features = ["json", "native-tls", "gzip"] }
# `native-tls` → `openssl-sys`: avoid system OpenSSL (CI/cross); compile OpenSSL from source.
openssl-sys = { version = "0.9.115", features = ["vendored"] }
sha2 = "0.11"
libc = "0.2"

[dev-dependencies]
