# Cross-compile for Eight Sleep Pod SOM (aarch64 Linux).
#
# **Recommended for binaries that must run on the Pod:** static **musl** (no host glibc dependency).
# GitHub Actions release builds use `cargo zigbuild` → `aarch64-unknown-linux-musl`.
#
#   rustup target add aarch64-unknown-linux-musl
#   cargo install cargo-zigbuild --version 0.23.4 --locked   # lockfile → deps compatible with Rust 1.99 (see rust-toolchain.toml)
#   # Zig must be on PATH — https://ziglang.org/download/  or snap install zig --classic
#   # (cargo-zigbuild >= 0.23.4: rustc >= 1.98 passes -Wl,--fix-cortex-a53-843419 for
#   # aarch64-unknown-linux-musl; zig cc rejects it and the final link fails)
#   cargo zigbuild --release --target aarch64-unknown-linux-musl
#
# Binary: `target/aarch64-unknown-linux-musl/release/lunaris`
#
# **Alternative:** GNU target links against the cross-toolchain glibc (often *newer* than the Pod).
# If you see `GLIBC_x.y not found` on the Pod, use musl instead of this:
#
#   Debian/Ubuntu: sudo apt install gcc-aarch64-linux-gnu
#   rustup target add aarch64-unknown-linux-gnu
#   cargo build --release --target aarch64-unknown-linux-gnu

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
